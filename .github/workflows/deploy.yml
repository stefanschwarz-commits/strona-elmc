name: Deploy theme to dev.ekmp.pl

on:
  push:
    branches: [main]
    paths:
      - "theme/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./theme/
          server-dir: ./wp-content/themes/elmc2027/
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md

      # Files uploaded via the WebAs FTP subaccount default to permissions
      # the web server user can't read (a hosting platform bug, reported to
      # CyberFolks). Force-fix them after every deploy until that's resolved.
      - name: Fix file permissions (WebAs FTP bug workaround)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" \
            -e "set ssl:verify-certificate no; chmod -R 755 wp-content/themes/elmc2027; bye"

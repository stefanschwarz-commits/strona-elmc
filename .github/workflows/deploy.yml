name: Deploy theme to dev.ekmp.pl

on:
  push:
    branches: [main]
    paths:
      - "theme/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./theme/
          server-dir: ./wp-content/themes/elmc2027/
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
